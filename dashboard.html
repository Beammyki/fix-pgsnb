<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard สรุปงบประมาณ PR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style> @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap'); body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm">
      <h1 class="text-3xl font-bold text-gray-800 mb-4 md:mb-0">📊 Dashboard สรุปงบประมาณ PR</h1>
      <div class="flex space-x-3 w-full md:w-auto">
        <select id="monthFilter" class="w-full md:w-48 px-4 py-3 border border-gray-300 rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500" onchange="filterData()">
          <option value="all">📅 ดูทุกเดือน</option>
          <option value="1">มกราคม</option><option value="2">กุมภาพันธ์</option><option value="3">มีนาคม</option>
          <option value="4">เมษายน</option><option value="5">พฤษภาคม</option><option value="6">มิถุนายน</option>
          <option value="7">กรกฎาคม</option><option value="8">สิงหาคม</option><option value="9">กันยายน</option>
          <option value="10">ตุลาคม</option><option value="11">พฤศจิกายน</option><option value="12">ธันวาคม</option>
        </select>
        <select id="yearFilter" class="w-full md:w-32 px-4 py-3 border border-gray-300 rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500" onchange="filterData()">
          <option value="all">ทุกปี</option>
          <option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option>
        </select>
      </div>
    </div>

    <!-- สรุปตัวเลข (Cards) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white p-6 rounded-3xl shadow-md border-b-4 border-blue-500 transform hover:-translate-y-1 transition">
        <div class="text-gray-500 text-sm font-semibold tracking-wide">ใบ PR ที่เปิดทั้งหมด (เคส)</div>
        <div class="text-5xl font-extrabold text-gray-800 mt-3" id="totalCases">0</div>
      </div>
      <div class="bg-white p-6 rounded-3xl shadow-md border-b-4 border-green-500 transform hover:-translate-y-1 transition">
        <div class="text-gray-500 text-sm font-semibold tracking-wide">✅ อนุมัติงบแล้ว (เคส)</div>
        <div class="text-5xl font-extrabold text-green-500 mt-3" id="approvedCases">0</div>
      </div>
      <div class="bg-white p-6 rounded-3xl shadow-md border-b-4 border-red-500 transform hover:-translate-y-1 transition bg-gradient-to-br from-white to-red-50">
        <div class="text-gray-500 text-sm font-semibold tracking-wide">💰 รวมงบประมาณ (บาท)</div>
        <div class="text-5xl font-extrabold text-red-600 mt-3" id="totalCost">0 ฿</div>
      </div>
    </div>

    <!-- กราฟ (Chart) -->
    <div class="bg-white p-6 rounded-3xl shadow-md">
      <h2 class="text-xl font-bold text-gray-700 mb-6 flex items-center">
        <span class="mr-2">🏢</span> งบประมาณแยกตามแผนก (เฉพาะที่อนุมัติแล้ว)
      </h2>
      <div class="relative h-72 w-full">
        <canvas id="deptChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // 👇 แก้ไข URL เป็นของ Google Apps Script ของคุณ 👇
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz0_zEg8a0ylriCAvcyQCadncKQ6nWVEThGmqo-3TtfdrpKL31VxoKVFlWHg75R7HA9aA/exec";
    
    let allData = [];
    let chartInstance = null;

    // โหลดข้อมูล Real-time เมื่อเปิดหน้าเว็บ
    fetch(GAS_URL + "?action=getDashboardData")
      .then(res => res.json())
      .then(data => { allData = data; filterData(); })
      .catch(err => console.error("Error loading data:", err));

    function filterData() {
      const month = document.getElementById('monthFilter').value;
      const year = document.getElementById('yearFilter').value;
      
      let filtered = allData.filter(item => {
        const d = new Date(item.date);
        const matchMonth = (month === 'all') ? true : (d.getMonth() + 1).toString() === month;
        const matchYear = (year === 'all') ? true : d.getFullYear().toString() === year;
        return matchMonth && matchYear;
      });

      let totalCases = filtered.length;
      let approved = filtered.filter(i => i.status.includes('อนุมัติ')).length;
      let cost = filtered.filter(i => i.status.includes('อนุมัติ')).reduce((sum, item) => sum + (Number(item.price) || 0), 0);
      
      // Animate ตัวเลข
      document.getElementById('totalCases').innerText = totalCases;
      document.getElementById('approvedCases').innerText = approved;
      document.getElementById('totalCost').innerText = cost.toLocaleString() + " ฿";

      // คำนวณกราฟ (เอาเฉพาะที่อนุมัติแล้วมาสรุป)
      let deptSums = {};
      filtered.filter(i => i.status.includes('อนุมัติ')).forEach(i => {
        deptSums[i.dept] = (deptSums[i.dept] || 0) + (Number(i.price) || 0);
      });
      
      drawChart(Object.keys(deptSums), Object.values(deptSums));
    }

    function drawChart(labels, data) {
      const ctx = document.getElementById('deptChart').getContext('2d');
      if(chartInstance) chartInstance.destroy();
      
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'ยอดอนุมัติงบ (บาท)',
            data: data,
            backgroundColor: 'rgba(59, 130, 246, 0.8)',
            hoverBackgroundColor: 'rgba(37, 99, 235, 1)',
            borderRadius: 8,
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { borderDash: [5, 5] }, ticks: { callback: function(value) { return value.toLocaleString() + ' ฿'; } } },
            x: { grid: { display: false } }
          },
          animation: { duration: 1000, easing: 'easeOutQuart' }
        }
      });
    }
  </script>
</body>
</html>
